name: Continuous Integration (CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Code Quality, Tests, Build & Lighthouse Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-fix formatting and linting (Biome)
        run: npm run lint:fix

      - name: Auto-commit formatted code back to PR
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix formatting and linting with Biome"
          branch: ${{ github.head_ref }}

      - name: Deterministic Quality Gate (Type Check + Biome Check + Vitest Coverage)
        run: npm run quality

      - name: Build Production Bundle
        run: npm run build

      - name: Audit Performance & Accessibility (Lighthouse CI)
        run: npm run lhci
