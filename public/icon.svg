<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#0f0e0c"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Icon shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Pizza Slice Graphic -->
  <g filter="url(#shadow)" transform="translate(0, 8)">
    <!-- Crust Arc -->
    <path d="M 128,140 C 200,90 312,90 384,140 L 370,165 C 300,120 212,120 142,165 Z" fill="url(#crustGrad)"/>
    
    <!-- Dough Body / Sauce Base -->
    <path d="M 142,165 C 212,120 300,120 370,165 L 256,420 Z" fill="url(#sauceGrad)"/>
    
    <!-- Melted Cheese Layer -->
    <path d="M 155,185 C 215,145 297,145 357,185 L 256,390 Z" fill="url(#cheeseGrad)"/>
    
    <!-- Basil leaves / Pepperoni accents -->
    <circle cx="230" cy="220" r="18" fill="#ef4444" opacity="0.9"/>
    <circle cx="282" cy="245" r="16" fill="#ef4444" opacity="0.9"/>
    <circle cx="245" cy="300" r="15" fill="#ef4444" opacity="0.9"/>
    
    <path d="M 210,250 C 200,240 195,255 205,265 C 215,275 225,260 210,250 Z" fill="#22c55e"/>
    <path d="M 290,290 C 280,280 275,295 285,305 C 295,315 305,300 290,290 Z" fill="#22c55e"/>

    <!-- Flour Dust Accent -->
    <circle cx="160" cy="130" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="175" cy="122" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="340" cy="128" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="325" cy="120" r="2" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
